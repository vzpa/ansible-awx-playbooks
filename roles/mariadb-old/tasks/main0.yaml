---
# tasks file for mariadb

- name: actualizar repositorios
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_facts['distribution'] | lower =='debian'
- name: Instalar MariaDB
  ansible.builtin.apt: 
     name: mariadb-server
     state: present
  when: ansible_facts['distribution'] | lower =='debian' 

- name: arrancar MariaDB
  ansible.builtin.service:
          name: mariadb
          state: started
  when: ansible_facts['distribution'] | lower =='debian' 