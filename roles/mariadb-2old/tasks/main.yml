---
# tasks file for mariadb


- name: Actualizar repositorios
  ansible.builtin.apt:
    update_cache: yes
    
  when: ansible_facts['distribution'] | lower =='debian'
- name: Instalar {{software}}
  ansible.builtin.apt: 
     name: "{{software}}"
     state: present
  when: ansible_facts['distribution'] | lower =='debian' 

- name: arrancar el servicio {{servicio}}
  ansible.builtin.service:
          name: "{{servicio}}"
          state: started
  when: ansible_facts['distribution'] | lower =='debian' 
  notify: 
    - copiar_script_sql
    - crear_bd
