---
- name: Instalar Lynis desde el repositorio oficial de CISOfy
  hosts: Desarrollo
  become: yes
  tasks:

    - name: Instalar yum-utils (para yum-config-manager)
      dnf:
        name: yum-utils
        state: present

    - name: Agregar repositorio oficial de Lynis
      command: >
        yum-config-manager
        --add-repo https://packages.cisofy.com/community/lynis/rpm/
      args:
        creates: /etc/yum.repos.d/packages_cisofy_com_community_lynis_rpm_.repo

    - name: Importar clave GPG de CISOfy
      rpm_key:
        state: present
        key: https://packages.cisofy.com/keys/cisofy-software.asc

    - name: Instalar Lynis desde el repositorio de CISOfy
      dnf:
        name: lynis
        state: present
