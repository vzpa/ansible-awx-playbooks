---
- name: Descargar imagen Docker
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes
  
  tasks:
    - name: Descargar Tomcat 
      community.docker.docker_image:
        name: tomcat
        source: pull
    - name: Etiquetar imagen Tomcat
      community.docker.docker_image:
        name: tomcat
        repository: mi-tomcat
        source: local

    - name: Crear un contenedor con Busybox
      community.docker.docker_container:
        name: contenedor1
        image: busybox
        state: started
    

    - name: Crear un contenedor interactivo con Debian
      community.docker.docker_container:
        name: contenedor_debian
        image: debian
        state: started
        interactive: true
    
     
